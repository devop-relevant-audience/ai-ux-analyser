<!DOCTYPE html>
<html>

<head>
    <title>Report</title>

    <style>
        .screenshots {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .screenshot {
            text-align: center;
            flex: 1;
        }

        .screenshot img {
            width: 100%;
            max-width: 250px;
            border: 1px solid #ccc;
        }
    </style>

</head>

<body>

<h1>UX Report</h1>

<p>
    <strong>URL:</strong> {{ url }}
</p>

<div class="screenshots">

    <div class="screenshot">
        <h2>Mobile</h2>
        <a href="/{{ screenshots.mobile }}" target="_blank">
            <img src="/{{ screenshots.mobile }}">
        </a>
    </div>

    <div class="screenshot">
        <h2>Tablet</h2>
        <a href="/{{ screenshots.tablet }}" target="_blank">
            <img src="/{{ screenshots.tablet }}">
        </a>
    </div>

    <div class="screenshot">
        <h2>Desktop</h2>
        <a href="/{{ screenshots.desktop }}" target="_blank">
            <img src="/{{ screenshots.desktop }}">
        </a>
    </div>

</div>

<hr>

<h2>Scores</h2>

<ul>
    <li>Overall: {{ report.overall }}</li>
    <li>Performance: {{ report.performance }}</li>
    <li>Accessibility: {{ report.accessibility }}</li>
</ul>

<h2>AI Comment</h2>

<p>{{ report.comment }}</p>

<a href="/">Analyze another website</a>

</body>

</html>
