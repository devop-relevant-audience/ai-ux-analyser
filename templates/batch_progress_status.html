<div
  id="batch-progress"
  hx-get="/analyse/batch/{{ batch_id }}/status"
  hx-trigger="every 2s"
  hx-target="#batch-progress"
  hx-swap="outerHTML"
>
  <p>
    {{ completed }} of {{ total }} analyses completed
  </p>

  <div class="progress-bar">
    <div
      class="progress-bar-fill"
      style="width: {{ progress }}%"
    ></div>
  </div>
</div>
